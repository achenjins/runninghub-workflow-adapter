# 复制本文件为 config.toml 后填写你的配置
# 注意：config.toml 已被 .gitignore 排除，不会提交到仓库

[plugin]
config_version = "1.1.0"

[server]
base_url = "https://www.runninghub.ai"
api_key = ""
base_url_cn = "https://www.runninghub.cn"
api_key_cn = ""

[generation]
poll_interval = 15
max_wait = 1800
max_concurrent = 2
download_timeout = 120

[cleanup]
enable = false
recall_seconds = 90

[detect]
use_llm = true
model = "utils"

[llm]
enhance_model = "utils"

[access]
# 访问控制（留空=不限制；max_per_user_per_hour = 0 表示不限频）
allow_users = []
allow_groups = []
max_per_user_per_hour = 0
# 管理员用户 ID（可用 /rh中断 中断所有人的任务）
admin_users = []

# ────────────────────────────────────────────────────────────
# 工作流列表（结构化配置，可在 WebUI「工作流列表」中增删）
#
# 推荐方式：聊天中发送 /识别工作流 <工作流ID> <名称>，自动识别输入节点并写入；
# 或在 WebUI 的「工作流列表」表单里手动增删工作流与输入节点。
#
# 每个工作流一项 [[workflows.items]]，节点再追加
# [[workflows.items.input_nodes]]（追加到最近一个工作流项下）。
#
# [[workflows.items]]
# name = "动漫生图"
# workflow_id = "2087492768787685378"
# instance_type = "Standard"      # Standard / Plus / Ultra
# region = "overseas"             # overseas=海外(runninghub.ai) / domestic=国内(runninghub.cn)
# llm_enhance = false             # LLM 扩写开关
# llm_template_path = ""          # 扩写模板路径（相对插件目录）
#
# [[workflows.items.input_nodes]]
# node_id = "353"
# field_name = "prompt"
# field_value = ""                # 留空：由用户提供；填写：作为默认值
# value_type = "prompt"           # prompt=主提示词 / text=可编辑配置 / default=固定默认值 / image=图片 / audio=语音 / 空=自动推断
# label = "提示词"
#
# 节点规则：
# - prompt：主提示词，接收命令/LLM 扩写文本（整个工作流仅一个，多了报错）
# - text：可编辑配置（带默认值 field_value），上传文件后询问用户是否修改
# - default：固定默认值，直接使用、不询问；无默认值时跳过
# - image/audio：留空时按顺序等待上传，可只上传部分；
#   发送「跳过剩余」直接开始，未上传的节点使用工作流默认值
# - 总共最多 32 个节点
#
# 默认不带任何工作流，请按上面的注释自行添加或使用 /识别工作流 命令。
