# 复制本文件为 config.toml 后填写你的配置
# 配置页使用中文标题和下拉选项，保存后选项值也是中文；旧英文取值仍可读取。
# 配置键名保留兼容。实际配置文件已排除在版本控制之外。

[plugin]
config_version = "1.2.0"

[server]
base_url = "https://www.runninghub.ai"
api_key = ""
base_url_cn = "https://www.runninghub.cn"
api_key_cn = ""

[generation]
poll_interval = 15
max_wait = 1800
max_concurrent = 2
download_timeout = 120
max_queued = 10
max_file_mb = 64
query_retries = 3
delivery_retries = 2

[feature]
# 自动撤回（仅 NapCat / QQ 适配器生效）
enable = false
recall_seconds = 90
# 节点识别
use_llm = true
model = "utils"
# 提示词扩写
enhance_model = "utils"

[access]
# 访问控制（留空=不限制；max_per_user_per_hour = 0 表示不限频）
allow_users = []
allow_groups = []
max_per_user_per_hour = 0
# 管理员用户 ID（可用 /rh中断 中断所有人的任务）
admin_users = []
# 聊天中识别并写入工作流配置需要先填好上面的管理员 QQ
manage_workflows_admin_only = true

[natural_language]
enabled = true
history_limit = 20
media_ttl_seconds = 3600
max_candidates = 12
planner_model = "utils"
# 模型仅可选择：replyer、planner、utils、vlm。
# 视觉模型默认对应宿主的 vlm；旧空值也改用此项。识图失败仍上传原图。
vision_model = "vlm"
# 每人每个会话保留最近使用的原图与约五十字简介；填零关闭并清空。
recent_images = 5
# 把用户头像（群聊含群头像）作为可选素材，支持「画我」类请求；不需要可设 false
avatar_candidates = true
llm_timeout = 45

# ────────────────────────────────────────────────────────────
# 工作流列表（结构化配置，可在 WebUI「工作流列表」中增删）
#
# 推荐方式：聊天中发送 /识别工作流 <工作流ID> <名称>，自动识别输入节点并写入；
# 或在 WebUI 的「工作流列表」表单里手动增删工作流与输入节点。
#
# 每个工作流一项 [[workflows.items]]，节点再追加
# [[workflows.items.input_nodes]]（追加到最近一个工作流项下）。
#
# [[workflows.items]]
# name = "动漫生图"
# workflow_id = "2087492768787685378"
# instance_type = "标准"         # 标准 / 增强 / 旗舰
# region = "国外"               # 国外 / 国内
# llm_enhance = false             # 扩写提示词
# llm_template_path = ""          # 扩写模板路径（相对插件目录）
# description = "动漫角色文生图"
# capability = "文字生图"       # 也可选图片编辑、文字生视频、图片生视频、多素材生成
# output_type = "图片"          # 图片 / 视频 / 音频 / 文件
# natural_language = true
# prompt_profile = "自动选择"   # 自动选择 / 图片生成 / 图片编辑 / 视频生成 / 保留原文
#
# [[workflows.items.input_nodes]]
# node_id = "353"
# field_name = "prompt"
# field_value = ""                # 留空：由用户提供；填写：作为默认值
# value_type = "主提示词"        # 自动判断 / 主提示词 / 可编辑参数 / 固定默认值 / 图片 / 音频 / 视频
# label = "提示词"
# input_key = "prompt"           # 留空时使用 节点ID.字段名
# role = ""                      # 可填主体、风格、背景、首帧、尾帧
# required = false               # 默认关闭；开启后，无默认值时必须补齐内容
# parameter_type = "文字"        # 文字 / 整数 / 小数 / 开关，仅用于可编辑参数
# choices = []                   # text 参数枚举，如 ["16:9", "1:1"]
# minimum = 64                   # 数字参数下界；不限制时省略
# maximum = 2048                 # 数字参数上界；不限制时省略
#
# 节点规则：
# - prompt：主提示词，优先使用 /rh运行 后的描述或 LLM 扩写文本；
#   没有输入时回退默认值；仅开启必填且没有默认值时才追问描述
#   （整个工作流仅一个，多了报错）
# - text：自然语言保留默认值，只覆盖明确指定参数；命令路径保留配置确认
# - default：固定默认值，直接使用、不询问；无默认值时跳过
# - image/audio/video：自然语言按素材 ID 和角色绑定，命令按提示顺序上传；
#   只有 required=false 的可选素材能跳过。有默认值的媒体可在自然语言中明确覆盖。
# - 总共最多 32 个节点
#
# 默认不带任何工作流，请按上面的注释自行添加或使用 /识别工作流 命令。
